<!-- @dsCard group="Foundations" name="Imagery" subtitle="Grayscale — photographs print in pure black and white." viewport="640x480" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Modernist — Imagery</title>
<link rel="stylesheet" href="../styles.css" />
<style>
.demo { max-width: 620px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-8); }
.demo-head {
  font-family: var(--font-body); font-size: 11px; font-weight: inherit;
  letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55;
  margin: var(--space-6) 0 var(--space-3);
}
.demo-head:first-child { margin-top: 0; }
.note { font-size: 12px; opacity: 0.6; max-width: 60ch; }
code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 0.92em; }
.frame img { width: 100%; border-radius: var(--radius-md); }
</style>
</head>
<body>
<main class="demo">
<div class="demo-head">Image treatment</div>
  <figure>
    <div class="grayscale frame"><img src="../assets/photo.jpg" alt="The Modernist reference photograph" /></div>
    <figcaption>Grayscale — photographs print in pure black and white.</figcaption>
  </figure>
  <div class="demo-head">Usage</div>
  <p class="note">Every content photograph goes through the <code>.grayscale</code> wrapper — never place a raw, untreated image.</p>
</main>
</body>
</html>
